<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egg Timer</title>
    <link rel="stylesheet" href="index.css" />
    <script defer src="render.js"></script>
  </head>
    <body>
      <div class="wrapper">
        <header>
          <div class="header-container">
            <h2>Egg Timer <code>&lt;3</code></h2>
            <div class="shrink-close-icons">
              <img src="../Images/minimize.png" alt="Shrink icon" class="shrink-icon"/>
              <img src="../Images/close.png" alt="Close icon" class="close-icon"/>
            </div>
          </div>
        </header>

        <main>
          <div class="start-container">
            <h1>Let's time your egg!</h1>
            <button id="start-btn">Start!</button> 
          </div>
        </main>
      </div>
    </body>
</html>
