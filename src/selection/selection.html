<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Timer</title>
  <link rel="stylesheet" href="selection.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <script defer src="../renderer.js"></script>
</head>
<body>
  <div class="wrapper">
    <header>
        <div class="header-container">
            <h2>Egg Timer <code>&lt;3</code></h2>
            <div class="shrink-close-icons">
              <img src="../../Images/minimize.png" alt="Shrink icon" class="shrink-icon"/>
              <img src="../../Images/close.png" alt="Close icon" class="close-icon"/>
            </div>
          </div>
        </header>
        <main>
            <div class="egg-selection-container">
              <h2>What are you making today?</h2>
              <div class="egg-options">
                <div class="egg-option">
                  <button id="soft-egg" class="egg-button" data-time="3">
                    <img src="../../Images/softboiled-egg.png" alt="Soft Boiled Egg">
                  </button>
                  <p>Soft Boiled</p>
                </div>
                <div class="egg-option">
                  <button id="hard-egg" class="egg-button" data-time="7">
                    <img src="../../Images/mediumboiled-egg.png" alt="Hard Boiled Egg">
                  </button>
                  <p>Hard Boiled</p>
                </div>
                <div class="egg-option">
                  <button id="fried-egg" class="egg-button" data-time="5">
                    <img src="../../Images/hardboiled-egg.png" alt="Fried Egg">
                  </button>
                  <p>Fried Egg</p>
                </div> 
                <div class="egg-option">
                  <button id="scrambled-egg" class="egg-button" data-time="4">
                    <img src="../../Images/extraboiled-egg.png" alt="Scrambled Egg">
                  </button>
                  <p>Scrambled Egg</p>
                </div>
              </div>
            </div>
          </main>
</body>
</html>
