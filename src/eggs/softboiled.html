<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Egg Timer</title>
    <link rel="stylesheet" href="./eggs.css" />
    
    <script defer src="../renderer.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="header-container">
          <h2>Egg Timer <code>&lt;3</code></h2>
          <div class="shrink-close-icons">
            <img src="../../Images/minimize.png" alt="Shrink icon" class="shrink-icon"/>
            <img src="../../Images/close.png" alt="Close icon" class="close-icon"/>
          </div>
        </div>
      </header>
      <main>
        <div class="timer-container">
            <p>Your egg is ready in...<p>
            <p><span id="timer">3:00</span></p>
            <script>
                const eggTime = 3 * 60; // 3 minutes
            </script>
            <script src="timer.js"></script>
            <div class="buttons">
                <button onclick="location.href='../selection/selection.html'" type="button">back</button>
            </div>
        </div>
      </main>
    </div>
  </body>
</html>
